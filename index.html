<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/x-icon" href="/favicon.ico" />
  <link rel="apple-touch-icon" sizes="180x180" href="/icons/app-icon-180.png" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Smart School Management App</title>

  <!-- PWA Manifest -->
  <link rel="manifest" href="/manifest.json" />

  <!-- Theme colors for mobile browsers -->
  <meta name="theme-color" content="#4F46E5" />
  <meta name="msapplication-TileColor" content="#4F46E5" />

  <!-- iOS PWA Support -->
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="SchoolApp" />
  <link rel="icon" type="image/x-icon" href="/favicon.ico" />

  <!-- Description for SEO and PWA -->
  <meta name="description"
    content="Complete school management system for students, teachers, parents and administrators. Works offline!" />
  <meta name="robots" content="index, follow" />
  <meta name="author" content="Oliskey" />
  <link rel="canonical" href="https://school-app-oliskeylee.vercel.app/" />

  <!-- Open Graph -->
  <meta property="og:type" content="website" />
  <meta property="og:title" content="Oliskey — Smart School Management" />
  <meta property="og:description" content="Multi-tenant school management platform for students, teachers, parents and administrators. Works offline." />
  <meta property="og:url" content="https://school-app-oliskeylee.vercel.app/" />
  <meta property="og:image" content="https://school-app-oliskeylee.vercel.app/icons/app-icon-180.png" />
  <meta property="og:site_name" content="Oliskey" />

  <!-- Twitter -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Oliskey — Smart School Management" />
  <meta name="twitter:description" content="Multi-tenant school management platform for students, teachers, parents and administrators." />
  <meta name="twitter:image" content="https://school-app-oliskeylee.vercel.app/icons/app-icon-180.png" />

  <!-- Force light mode to prevent dark mode color issues -->
  <script>document.documentElement.classList.remove('dark');</script>
  <meta name="color-scheme" content="light only">
  <style>
    :root {
      color-scheme: light only;
    }
  </style>

  <!-- Google Identity Services -->
  <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>

<body class="bg-gray-100">
  <noscript>
    <div style="padding:24px;font-family:system-ui,sans-serif;text-align:center">
      <h1>Oliskey School Management</h1>
      <p>This application requires JavaScript to be enabled. Please turn on JavaScript in your browser settings and reload the page.</p>
    </div>
  </noscript>
  <div id="root" role="main" aria-label="Oliskey School Management application"></div>
  <script type="module" src="/index.tsx"></script>

</html>
