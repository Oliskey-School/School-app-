  <!-- iOS PWA Support -->

  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="SchoolApp" />
  <link rel="icon" type="image/x-icon" href="/favicon.ico" />

  <!-- Description for SEO and PWA -->
  <meta name="description"
    content="Oliskey School App connects administrators, teachers, students and parents in one school management and engagement platform. Manage academics, attendance, results, communication and everyday school work with AI-powered tools." />
  <meta name="robots" content="index, follow" />
  <meta name="author" content="Oliskey" />
  <link rel="canonical" href="https://app.oliskey.com/" />

  <!-- Open Graph -->
  <meta property="og:type" content="website" />
  <meta property="og:title" content="Oliskey School App | School Management &amp; Engagement Platform" />
  <meta property="og:description" content="Oliskey School App connects administrators, teachers, students and parents in one school management and engagement platform. Change how school feels." />
  <meta property="og:url" content="https://app.oliskey.com/" />
  <!-- 1200x630: the card below declares summary_large_image, which the old
       180x180 PWA icon could not satisfy (previews rendered tiny or not at all). -->
  <meta property="og:image" content="https://app.oliskey.com/oliskey-school-app-social-card.png" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta property="og:image:alt" content="Oliskey School App — change how school feels. For administrators, teachers, students and parents." />
  <meta property="og:site_name" content="Oliskey" />
  <meta property="og:locale" content="en_NG" />

  <!-- Twitter -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Oliskey School App | School Management &amp; Engagement Platform" />
  <meta name="twitter:description" content="Oliskey School App connects administrators, teachers, students and parents in one school management and engagement platform." />
  <meta name="twitter:image" content="https://app.oliskey.com/oliskey-school-app-social-card.png" />
  <meta name="twitter:image:alt" content="Oliskey School App — change how school feels." />

  <!-- Structured data.
       Two distinct entities, deliberately kept separate:
         Organization        = Oliskey, the company        -> www.oliskey.com
         SoftwareApplication = Oliskey School App, the app -> app.oliskey.com
       The publisher previously pointed at app.oliskey.com, which told search
       engines the application WAS the company and left the real company site
       unconnected to the product. www.oliskey.com is used because oliskey.com
       permanently redirects (308) there, so it is the resolvable canonical.
       Only facts that can be verified from the product are asserted: no
       ratings, reviews, counts, awards or social profiles are claimed.

       sameAs lists third-party profiles that are the SAME product entity, so
       search engines can reconcile them with this one. It is an identity link,
       NOT a quality claim: no aggregateRating, ratingValue or reviewCount is
       published here, and none may be added until a verified rating actually
       exists on that profile. Schema.org rating fields describe ratings the
       publisher can substantiate — asserting G2's numbers from here would be
       both unverifiable and a structured-data violation. -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@graph": [
      {
        "@type": "Organization",
        "@id": "https://www.oliskey.com/#organization",
        "name": "Oliskey",
        "url": "https://www.oliskey.com/",
        "logo": "https://app.oliskey.com/icons/app-icon-512.png"
      },
      {
        "@type": "WebSite",
        "@id": "https://app.oliskey.com/#website",
        "name": "Oliskey School App",
        "url": "https://app.oliskey.com/",
        "inLanguage": "en-NG",
        "publisher": { "@id": "https://www.oliskey.com/#organization" }
      },
      {
        "@type": "SoftwareApplication",
        "@id": "https://app.oliskey.com/#software",
        "name": "Oliskey School App",
        "url": "https://app.oliskey.com/",
        "applicationCategory": "EducationalApplication",
        "operatingSystem": "Web",
        "description": "Oliskey School App connects administrators, teachers, students and parents in one school management and engagement platform. Manage academics, attendance, results, communication and everyday school work.",
        "inLanguage": "en-NG",
        "isAccessibleForFree": true,
        "publisher": { "@id": "https://www.oliskey.com/#organization" },
        "brand": { "@id": "https://www.oliskey.com/#organization" },
        "sameAs": [
          "https://www.g2.com/products/oliskey-school-app/reviews"
        ]
      }
    ]
  }
  </script>

  <!-- Colour scheme, applied before first paint so there is no flash. The
       choice ("light" | "dark" | "system") is saved per device and to the
       account (lib/uiPreferences.ts); the dark palette itself is one generated
       stylesheet (styles/dark-theme.css) that covers every screen. -->
  <script>
    (function () {
      try {
        var s = localStorage.getItem('colorScheme') || (localStorage.getItem('darkMode') === 'true' ? 'dark' : 'light');
        var dark = s === 'dark' || (s === 'system' && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.classList.toggle('dark', dark);
      } catch (e) { document.documentElement.classList.remove('dark'); }
    })();
  </script>
  <meta name="color-scheme" content="light dark">
  <style>
    :root {
      color-scheme: light only;
    }
  </style>

  <!-- Google Identity Services -->
  <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
