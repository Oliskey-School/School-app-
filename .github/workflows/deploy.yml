name: Production Deployment

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Build & Reload on Self-Hosted Server
    runs-on: self-hosted

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        # Use a cache directory scoped to this run instead of the runner's
        # shared /var/www/.npm — something outside this workflow (a VPS
        # cleanup cron, or another app sharing /var/www) periodically deletes
        # files from that shared cache mid-job, corrupting npm's
        # content-addressable store and failing `npm ci` with ENOENT on a
        # _cacache entry. This has already happened once before for the
        # runner's shared _actions cache (see commits 740a013 / a255998) —
        # same root cause, different shared directory. Isolating the cache
        # per-run costs a fresh download each time but can't be corrupted by
        # anything else touching /var/www.
        run: npm ci --cache "${{ runner.temp }}/npm-cache-${{ github.run_id }}"

      - name: Frontend Build
        run: npm run build

      - name: Backend Build
        # ecosystem.config.cjs runs the compiled backend/dist/backend/src/server.js —
        # this step was misnamed and only ran the frontend build above, so the
        # backend never actually got (re)compiled on deploy.
        run: npm run build:backend

      - name: Zero-Downtime PM2 Reload
        run: |
          command -v pm2 >/dev/null 2>&1 || npm install -g pm2 --no-audit --no-fund
          pm2 reload all --update-env || pm2 start ecosystem.config.cjs --env production
