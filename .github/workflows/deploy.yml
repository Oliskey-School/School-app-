name: Production Deployment

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Build & Reload on Self-Hosted Server
    runs-on: self-hosted

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        run: npm ci

      - name: Backend Typecheck & Build
        run: |
          npm run build

      - name: Zero-Downtime PM2 Reload
        run: |
          pm2 reload all --update-env || pm2 start ecosystem.config.js
