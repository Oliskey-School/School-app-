name: Production Deployment

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    name: Build & Reload on Self-Hosted Server
    runs-on: self-hosted

    steps:
      - name: Fix Safe Directory Permissions
        run: |
          git config --global --add safe.directory /var/www/School-app

      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          clean: false

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Production Dependencies
        working-directory: /var/www/School-app
        run: |
          npm ci

      - name: Build Application Artifacts
        working-directory: /var/www/School-app
        run: |
          npm run build --if-present

      - name: Execute Zero-Downtime PM2 Reload
        working-directory: /var/www/School-app
        run: |
          export PATH=$PATH:/usr/local/bin:~/.nvm/versions/node/v20.0.0/bin
          pm2 reload all --update-env || pm2 start ecosystem.config.js
