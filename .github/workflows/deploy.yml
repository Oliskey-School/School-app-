name: Production Deployment

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Build & Reload on Self-Hosted Server
    runs-on: self-hosted

    steps:
      - name: Fix Safe Directory Permissions
        # Added by a server-side commit (0bae67d, authored as root@cipher-lab.org)
        # that also reverted several already-diagnosed CI fixes — this one
        # piece is harmless and additive (just tells git to trust this path
        # regardless of ownership), so it's kept; the rest of that commit's
        # changes were not, since they reintroduced bugs verified against
        # real CI logs earlier the same day (wrong ecosystem.config filename,
        # missing backend build step, actions/checkout@v4's proven runner-IPC
        # failure, cancel-in-progress: true already reverted once before in
        # this repo's history for causing the same class of failure).
        run: git config --global --add safe.directory /var/www/School-app

      - name: Checkout Code
        # Plain git instead of actions/checkout@v4. The JS action writes its
        # internal state via the runner's _work/_temp/_runner_file_commands
        # IPC file — something outside this workflow periodically deletes
        # files under the runner's shared _work/_temp while jobs are running
        # (same root cause already diagnosed for the _actions cache in
        # 740a013/a255998, and for /var/www/.npm above), and when it hits
        # that specific file mid-step, actions/checkout dies with "Missing
        # file at path: .../save_state_...". A plain `run:` step never calls
        # that IPC mechanism at all, so it can't hit this failure — retrying
        # on top absorbs whatever transient window causes the deletion.
        run: |
          set -e
          # The orphaned-* renames below are a workaround for undeletable
          # files, which means they pile up on a persistent VPS and would
          # eventually fill the disk. Best-effort sweep of anything left
          # from a previous run — whatever is still undeletable stays, and
          # is someone's one-time host-side cleanup.
          find . -maxdepth 2 -name "*.orphaned-*" -mmin +60 -exec rm -rf {} + 2>/dev/null || true
          for attempt in 1 2 3; do
            echo "Checkout attempt $attempt/3"
            # rm -rf first: on Linux, unlink() works on files another process
            # still has open (the directory entry goes away immediately, unlike
            # git clean's rmdir-based removal, which fails with "Directory not
            # empty" the instant anything is touching a file inside). Whatever
            # is scanning this tree kept git clean -ffdx failing on
            # node_modules specifically (confirmed 2026-08-14) — removing it
            # ourselves first and excluding it from git clean's own pass avoids
            # that specific lock conflict.
            # Confirmed 2026-08-18 (runs 32181037716 / 32182333594): this
            # `rm -rf .git` was silently failing — its error went to
            # /dev/null and `|| true` swallowed the exit code — leaving a
            # corrupt object store behind. `git init` then reused it, and
            # the fetch died with "error: Could not read <sha>" / "bad
            # object" / "remote did not send all necessary objects" on all
            # 3 attempts. A genuinely empty .git would just fetch the sha
            # cleanly; "could not read" means the object file was there but
            # unreadable. Same rename-first treatment as node_modules below
            # (rename needs write on the parent only, not on the corrupt
            # contents), and loud this time rather than silent.
            if [ -d .git ]; then
              mv .git ".git.orphaned-$(date +%s)-$attempt" 2>/dev/null || true
              rm -rf .git 2>/dev/null || true
            fi
            if [ -d .git ]; then
              echo "::warning::.git survived rename+rm — trying sudo"
              sudo -n rm -rf .git 2>/dev/null || true
            fi
            if [ -d .git ]; then
              echo "::error::Cannot clear .git at $(pwd) — the git object store is corrupt and not removable by the runner user. Needs a one-time host-side: rm -rf $(pwd)/.git"
              exit 1
            fi
            # rename() only needs write permission on the parent directory,
            # not on the target's own contents — unlike rm -rf, which needs to
            # read into a directory to delete what's inside it. Confirmed
            # 2026-08-14: specific node_modules subdirectories are EACCES even
            # to scandir, so orphan them under a new name instead of fighting
            # a delete that can't succeed without host-level intervention.
            for d in node_modules dist backend/dist; do
              if [ -d "$d" ]; then
                mv "$d" "${d}.orphaned-$(date +%s)-$attempt" 2>/dev/null || true
              fi
              rm -rf "$d" 2>/dev/null || true
            done
            if [ -d node_modules ] || [ -d dist ] || [ -d backend/dist ]; then
              echo "rename+rm -rf left files behind, trying sudo..."
              sudo -n rm -rf node_modules dist backend/dist 2>/dev/null || echo "sudo unavailable or failed — needs manual fix on the runner host"
            fi
            git init -q
            git remote add origin "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
            # Exclude the orphaned-* names too — git clean doesn't know about
            # them and would try (and fail, on the same broken permissions)
            # to remove them otherwise. Renaming a directory doesn't fix the
            # permissions on the files inside it.
            if git fetch --depth 1 origin "${{ github.sha }}" && git checkout -qf FETCH_HEAD && git clean -ffdx -e node_modules -e dist -e backend/dist -e "node_modules.orphaned-*" -e "dist.orphaned-*" -e "backend/dist.orphaned-*" -e ".git.orphaned-*"; then
              echo "Checkout succeeded"
              exit 0
            fi
            echo "Checkout attempt $attempt failed"
            [ "$attempt" = "3" ] && exit 1
            sleep 5
          done

      - name: Setup Node
        # actions/setup-node@v4 hits the same runner-side corruption as
        # Checkout Code above, one level up: the runner downloads the
        # ACTION'S OWN code into the shared _work/_actions cache before
        # running it, and that download gets wiped by the same external
        # process (confirmed: "Can't find action.yml ... under
        # _work/_actions/actions/setup-node/v4" — identical symptom to the
        # _actions corruption already diagnosed in 740a013/a255998). This is
        # a persistent VPS, not an ephemeral container, so Node is already
        # installed on the host (every prior successful deploy proves it) —
        # just verify it instead of re-downloading a toolchain via a
        # mechanism this runner can't reliably use right now.
        run: |
          if ! command -v node >/dev/null 2>&1; then
            echo "::error::node not found on PATH on this runner host."
            exit 1
          fi
          echo "Using $(node --version), $(npm --version)"
          NODE_MAJOR=$(node -e "console.log(process.versions.node.split('.')[0])")
          if [ "$NODE_MAJOR" -lt 20 ]; then
            echo "::error::Node major version is $NODE_MAJOR, need >=20"
            exit 1
          fi

      - name: Install Dependencies
        # Use a cache directory scoped to this run instead of the runner's
        # shared /var/www/.npm — something outside this workflow (a VPS
        # cleanup cron, or another app sharing /var/www) periodically deletes
        # files from that shared cache mid-job, corrupting npm's
        # content-addressable store and failing `npm ci` with ENOENT on a
        # _cacache entry. This has already happened once before for the
        # runner's shared _actions cache (see commits 740a013 / a255998) —
        # same root cause, different shared directory. Isolating the cache
        # per-run costs a fresh download each time but can't be corrupted by
        # anything else touching /var/www.
        #
        # That same external interference also hits the actual extraction
        # target. First seen as TAR_ENTRY_ERROR ENOENT (files disappearing
        # mid-`npm ci`, cascading into a fatal protobufjs postinstall
        # failure). Then, on a later run, EACCES: permission denied on
        # thousands of unrelated node_modules files simultaneously, all
        # within a ~70ms window — that pattern (not scattered over time, one
        # atomic burst across the whole tree) is consistent with an
        # antivirus/endpoint-security agent or backup process running an
        # on-access scan over this directory, not a targeted cleanup cron.
        # This needs a real fix on the runner host itself (excluding
        # /opt/actions-runner/_work from whatever is scanning/backing it up)
        # — nothing in this workflow can fully prevent it, since the whole
        # tree can get hit inside a single retry's extraction window. Longer
        # spacing + more attempts is the most this step can do on its own.
        run: |
          for attempt in 1 2 3 4 5; do
            echo "npm ci attempt $attempt/5"
            # Confirmed 2026-08-14: specific node_modules subdirectories
            # (is-obj, nodemon, native-run...) are EACCES even to scandir —
            # deleting them requires reading their contents first, which is
            # exactly what's denied, and sudo isn't configured on this runner.
            # But rename() only needs write permission on the PARENT
            # directory, not the broken directory's own contents — orphan it
            # under a new name instead of trying to delete it, so npm ci
            # starts from a node_modules that doesn't exist yet rather than
            # fighting the broken one. (Orphaned dirs accumulate in _work
            # until someone with host access cleans them up — a disk-space
            # problem, not a build-blocking one.)
            if [ -d node_modules ]; then
              mv node_modules "node_modules.orphaned-$(date +%s)-$attempt" 2>/dev/null || true
            fi
            rm -rf node_modules 2>/dev/null || true
            if npm ci --cache "${{ runner.temp }}/npm-cache-${{ github.run_id }}-$attempt"; then
              echo "npm ci succeeded"
              exit 0
            fi
            echo "npm ci attempt $attempt failed"
            [ "$attempt" = "5" ] && exit 1
            sleep 30
          done

      - name: Frontend Build
        # Confirmed 2026-08-14: this exact commit's `npm run build` succeeds
        # cleanly when run locally (zero errors, full bundle) — a failure
        # here in CI is the same host-side interference as Install
        # Dependencies, not a real build error. Same retry treatment.
        #
        # Confirmed 2026-08-18: the same interference also deletes
        # scripts/check-env.mjs itself (the `prebuild` hook `npm run build`
        # runs first) between Checkout Code and this step, or between
        # retries — Checkout Code verifiably wrote it (it's a tracked file
        # in the checked-out commit), yet `node scripts/check-env.mjs`
        # fails with MODULE_NOT_FOUND on every one of 3 attempts. Restore it
        # from the git index before each attempt so a mid-job deletion of
        # this one file can't fail the whole build the way it did here.
        run: |
          for attempt in 1 2 3; do
            echo "Frontend build attempt $attempt/3"
            if [ ! -f scripts/check-env.mjs ]; then
              echo "scripts/check-env.mjs missing — restoring from git HEAD"
              git show HEAD:scripts/check-env.mjs > scripts/check-env.mjs
            fi
            if npm run build; then
              exit 0
            fi
            echo "Frontend build attempt $attempt failed"
            [ "$attempt" = "3" ] && exit 1
            sleep 15
          done

      - name: Backend Build
        # ecosystem.config.cjs runs the compiled backend/dist/backend/src/server.js —
        # a server-side commit today (0bae67d) dropped this step entirely
        # (its replacement only ran the frontend build), which would have
        # meant the compiled backend never gets rebuilt again, silently.
        # Restored. Same retry treatment as Frontend Build, for the same
        # reason.
        run: |
          for attempt in 1 2 3; do
            echo "Backend build attempt $attempt/3"
            if npm run build:backend; then
              exit 0
            fi
            echo "Backend build attempt $attempt failed"
            [ "$attempt" = "3" ] && exit 1
            sleep 15
          done

      # NOTE: the Production Critical Path E2E suite used to gate the deploy
      # at this point. It now lives in its own workflow — see
      # .github/workflows/playwright.yml ("E2E Tests") — running on a
      # GitHub-hosted runner with its own throwaway Postgres service.
      #
      # Moved because this self-hosted runner is missing the system libraries
      # Chromium links against (libnspr4, libnss3, libnssutil3, libXcomposite,
      # libXdamage, libXfixes, libXrandr, libxkbcommon) and has no passwordless
      # sudo to install them, so the gate failed on every run regardless of
      # whether the application code was sound.
      #
      # Consequence, stated plainly: nothing in THIS pipeline verifies the app
      # still works before it reaches production. The E2E Tests workflow
      # reports, it does not block. Make it a required status check on main to
      # get that protection back.

      - name: Sync to Deploy Path
        # Confirmed 2026-08-15: every step above builds inside the runner's
        # own workspace (/opt/actions-runner/_work/School-app-/School-app-),
        # but ecosystem.config.cjs sets cwd to DEPLOY_PATH
        # (/var/www/School-app) — a different directory this workflow
        # doesn't build in. Whoever pushed 0bae67d/17883bd may have
        # reconfigured the runner's own work directory to be
        # /var/www/School-app directly (their "Fix Safe Directory
        # Permissions" step and dropped `working-directory` overrides are
        # consistent with that) — if so this sync becomes a cheap,
        # effectively-no-op self-copy. If not, it's the difference between
        # PM2 running today's build or a stale one. Either way this step
        # can't make things worse and removes the dependency on an
        # unverified assumption about the runner's configuration.
        #
        # --exclude on .env/.env.production/logs matters even with --delete:
        # those only ever exist at the destination (never in git, never in
        # this workspace) and must survive the sync, not get deleted for
        # being "extra". The orphaned-* excludes skip the disk-bloat
        # artifacts from the node_modules EACCES workaround earlier in this
        # pipeline — no reason to ship those.
        #
        # node_modules is excluded too — confirmed 2026-08-15: some packages
        # already at the deploy path (nanoid, import-in-the-middle,
        # es-module-lexer) are owned by a different user than the runner's
        # service account (root, from files touched directly on the server),
        # so rsync can't overwrite or delete them and sudo isn't configured.
        # Never touching node_modules here at all sidesteps that; the next
        # step gives the deploy path its own independent npm ci instead.
        run: |
          DEPLOY_PATH="/var/www/School-app"
          RSYNC_ARGS=(-a --delete
            --exclude=.git
            --exclude=.env
            --exclude=.env.production
            --exclude=logs/
            --exclude=node_modules/
            --exclude='node_modules.orphaned-*'
            --exclude='dist.orphaned-*'
            --exclude='backend/dist.orphaned-*'
          )
          mkdir -p "$DEPLOY_PATH" 2>/dev/null || sudo -n mkdir -p "$DEPLOY_PATH"
          if [ "$(cd "${{ github.workspace }}" && pwd -P)" = "$(cd "$DEPLOY_PATH" 2>/dev/null && pwd -P)" ]; then
            echo "Workspace already is the deploy path — nothing to sync."
          elif command -v rsync >/dev/null 2>&1; then
            rsync "${RSYNC_ARGS[@]}" "${{ github.workspace }}/" "$DEPLOY_PATH/" \
              || sudo -n rsync "${RSYNC_ARGS[@]}" "${{ github.workspace }}/" "$DEPLOY_PATH/" \
              || { echo "::error::Sync to $DEPLOY_PATH failed even with sudo fallback — needs manual fix on the runner host."; exit 1; }
            echo "Synced to $DEPLOY_PATH"
          else
            echo "rsync not found, falling back to cp -a (no --delete, stale files may accumulate)"
            cp -a "${{ github.workspace }}/." "$DEPLOY_PATH/" \
              || sudo -n cp -a "${{ github.workspace }}/." "$DEPLOY_PATH/" \
              || { echo "::error::Sync to $DEPLOY_PATH failed even with sudo fallback — needs manual fix on the runner host."; exit 1; }
            echo "Synced to $DEPLOY_PATH"
          fi

      - name: Install Dependencies at Deploy Path
        # node_modules at DEPLOY_PATH is never touched by the sync step above
        # (see its comment) — give it a fully independent install instead of
        # trying to reconcile ownership. Same rename-before-delete pattern
        # already proven earlier in this pipeline: rename() only needs write
        # permission on the parent directory, so it works even on entries
        # owned by a different user that rm -rf/npm ci's own cleanup can't
        # touch directly.
        run: |
          DEPLOY_PATH="/var/www/School-app"
          cd "$DEPLOY_PATH"
          if [ "$(cd "${{ github.workspace }}" && pwd -P)" = "$(pwd -P)" ]; then
            echo "Workspace already is the deploy path — node_modules is already current from Install Dependencies."
            exit 0
          fi
          for attempt in 1 2 3; do
            echo "Deploy-path npm ci attempt $attempt/3"
            if [ -d node_modules ]; then
              mv node_modules "node_modules.orphaned-$(date +%s)-$attempt" 2>/dev/null \
                || sudo -n mv node_modules "node_modules.orphaned-$(date +%s)-$attempt" 2>/dev/null \
                || true
            fi
            rm -rf node_modules 2>/dev/null || true
            # Full install, not --omit=dev: pm2 is a devDependency but is the
            # one thing actually needed at runtime here (npx pm2 in the next
            # step resolves it from node_modules/.bin) — omitting dev deps
            # would leave it missing and fall back to npx downloading a temp
            # copy over the network on every deploy.
            if npm ci --cache "${{ runner.temp }}/npm-cache-deploy-${{ github.run_id }}-$attempt"; then
              echo "Deploy-path npm ci succeeded"
              exit 0
            fi
            echo "Deploy-path npm ci attempt $attempt failed"
            [ "$attempt" = "3" ] && { echo "::error::npm ci at $DEPLOY_PATH failed after 3 attempts — needs manual fix on the runner host."; exit 1; }
            sleep 15
          done

      - name: Zero-Downtime PM2 Reload
        # pm2 is a devDependency (npm ci already installed it into
        # node_modules/.bin) instead of relying on a global install — the
        # global fallback (`npm install -g pm2`) needs to write to
        # /usr/lib/node_modules, which requires root and fails with EACCES
        # for this runner's unprivileged user. npx resolves the local binary
        # first, so no install step is needed at all.
        #
        # ecosystem.config.cjs — NOT ecosystem.config.js (that filename
        # doesn't exist in this repo; a server-side commit today referenced
        # it and would have failed the fallback path).
        run: |
          cd /var/www/School-app
          npx pm2 reload all --update-env || npx pm2 start ecosystem.config.cjs --env production
