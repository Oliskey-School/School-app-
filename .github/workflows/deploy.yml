name: CI

# Continuous integration only — lint, test and build on every PR and push to main.
# Deployment to a host is NOT done here (Vercel / Railway / Supabase steps removed).
# Add your host's deploy steps here when you're ready, or deploy from your host directly.

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Backend typecheck
        run: cd backend && npx tsc --noEmit

      - name: Unit tests
        run: npm run test:run
        env:
          NODE_ENV: test

      - name: Production build (frontend)
        run: npm run build

      - name: Security audit (high+)
        run: npm audit --omit=dev --audit-level=high
