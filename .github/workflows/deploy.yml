name: Production Deployment

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Build & Reload on Self-Hosted Server
    runs-on: self-hosted

    steps:
      - name: Fix Safe Directory Permissions
        run: git config --global --add safe.directory /var/www/School-app

      - name: Checkout Code
        run: |
          set -e
          # The orphaned-* renames below are a workaround for undeletable
          # files, which means they pile up on a persistent VPS and would
          # eventually fill the disk. Best-effort sweep of anything left
          # from a previous run — whatever is still undeletable stays, and
          # is someone's one-time host-side cleanup.
          find . -maxdepth 2 -name "*.orphaned-*" -mmin +60 -exec rm -rf {} + 2>/dev/null || true
          for attempt in 1 2 3; do
            echo "Checkout attempt $attempt/3"
            # rm -rf first: on Linux, unlink() works on files another process
            # still has open (the directory entry goes away immediately, unlike
            # git clean's rmdir-based removal, which fails with "Directory not
            # empty" the instant anything is touching a file inside). Whatever
            # is scanning this tree kept git clean -ffdx failing on
            # node_modules specifically (confirmed 2026-08-14) — removing it
            # ourselves first and excluding it from git clean's own pass avoids
            # that specific lock conflict.
            # Confirmed 2026-08-18 (runs 32181037716 / 32182333594): this
            # `rm -rf .git` was silently failing — its error went to
            # /dev/null and `|| true` swallowed the exit code — leaving a
            # corrupt object store behind. `git init` then reused it, and
            # the fetch died with "error: Could not read <sha>" / "bad
            # object" / "remote did not send all necessary objects" on all
            # 3 attempts. A genuinely empty .git would just fetch the sha
            # cleanly; "could not read" means the object file was there but
            # unreadable. Same rename-first treatment as node_modules below
            # (rename needs write on the parent only, not on the corrupt
            # contents), and loud this time rather than silent.
            if [ -d .git ]; then
              mv .git ".git.orphaned-$(date +%s)-$attempt" 2>/dev/null || true
              rm -rf .git 2>/dev/null || true
            fi
            if [ -d .git ]; then
              echo "::warning::.git survived rename+rm — trying sudo"
              sudo -n rm -rf .git 2>/dev/null || true
            fi
            if [ -d .git ]; then
              echo "::error::Cannot clear .git at $(pwd) — the git object store is corrupt and not removable by the runner user. Needs a one-time host-side: rm -rf $(pwd)/.git"
              exit 1
            fi
            # rename() only needs write permission on the parent directory,
            # not on the target's own contents — unlike rm -rf, which needs to
            # read into a directory to delete what's inside it. Confirmed
            # 2026-08-14: specific node_modules subdirectories are EACCES even
            # to scandir, so orphan them under a new name instead of fighting
            # a delete that can't succeed without host-level intervention.
            for d in node_modules dist backend/dist; do
              if [ -d "$d" ]; then
                mv "$d" "${d}.orphaned-$(date +%s)-$attempt" 2>/dev/null || true
              fi
              rm -rf "$d" 2>/dev/null || true
            done
            if [ -d node_modules ] || [ -d dist ] || [ -d backend/dist ]; then
              echo "rename+rm -rf left files behind, trying sudo..."
              sudo -n rm -rf node_modules dist backend/dist 2>/dev/null || echo "sudo unavailable or failed — needs manual fix on the runner host"
            fi
            git init -q
            git remote add origin "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
            # Exclude the orphaned-* names too — git clean doesn't know about
            # them and would try (and fail, on the same broken permissions)
            # to remove them otherwise. Renaming a directory doesn't fix the
            # permissions on the files inside it.
            #
            # Merge note: this keeps github.sha over main's github.ref
            # (a0dccea, "fix bad tree object error"). That error was a symptom
            # of the corrupt .git object store fixed at its root above; since
            # that fix, github.sha has checked out cleanly on every run from
            # 32196424795 through 32426968440. The sha is also the exact commit
            # the run was dispatched for, which ref is not if the branch moves
            # mid-run. Revert to ref if bad-tree errors ever reappear.
            if git fetch --depth 1 origin "${{ github.sha }}" && git checkout -qf FETCH_HEAD && git clean -ffdx -e node_modules -e dist -e backend/dist -e "node_modules.orphaned-*" -e "dist.orphaned-*" -e "backend/dist.orphaned-*" -e ".git.orphaned-*"; then
              echo "Checkout succeeded"
              exit 0
            fi
            echo "Checkout attempt $attempt failed"
            [ "$attempt" = "3" ] && exit 1
            sleep 5
          done

      - name: Restore Environment & Binary Permissions
        run: |
          echo "Restoring production .env from persistent backup..."
          \cp -f /var/www/School-app-backup/.env ./.env 2>/dev/null || \cp -f /var/www/School-app-backup-20260818/.env ./.env 2>/dev/null || true
          \cp -f /var/www/School-app-backup/.env ./backend/.env 2>/dev/null || \cp -f /var/www/School-app-backup-20260818/.env ./backend/.env 2>/dev/null || true
          chmod -R +x node_modules/.bin 2>/dev/null || true

      - name: Setup Node
        run: |
          if ! command -v node >/dev/null 2>&1; then
            echo "::error::node not found on PATH on this runner host."
            exit 1
          fi
          echo "Using $(node --version), $(npm --version)"
          NODE_MAJOR=$(node -e "console.log(process.versions.node.split('.')[0])")
          if [ "$NODE_MAJOR" -lt 20 ]; then
            echo "::error::Node major version is $NODE_MAJOR, need >=20"
            exit 1
          fi

      - name: Install Dependencies
        run: |
          for attempt in 1 2 3 4 5; do
            echo "npm ci attempt $attempt/5"
            if [ -d node_modules ]; then
              mv node_modules "node_modules.orphaned-$(date +%s)-$attempt" 2>/dev/null || true
            fi
            rm -rf node_modules 2>/dev/null || true
            if npm ci --cache "${{ runner.temp }}/npm-cache-${{ github.run_id }}-$attempt"; then
              echo "npm ci succeeded"
              exit 0
            fi
            echo "npm ci attempt $attempt failed"
            [ "$attempt" = "5" ] && exit 1
            sleep 30
          done

      - name: Frontend Build
        run: |
          for attempt in 1 2 3; do
            echo "Frontend build attempt $attempt/3"
            if [ ! -f scripts/check-env.mjs ]; then
              echo "scripts/check-env.mjs missing — restoring from git HEAD"
              git show HEAD:scripts/check-env.mjs > scripts/check-env.mjs
            fi
            if npm run build; then
              exit 0
            fi
            echo "Frontend build attempt $attempt failed"
            [ "$attempt" = "3" ] && exit 1
            sleep 15
          done

      - name: Backend Build
        run: |
          for attempt in 1 2 3; do
            echo "Backend build attempt $attempt/3"
            if npm run build:backend; then
              exit 0
            fi
            echo "Backend build attempt $attempt failed"
            [ "$attempt" = "3" ] && exit 1
            sleep 15
          done

      # NOTE: the Production Critical Path E2E suite used to gate the deploy
      # at this point. It now lives in its own workflow — see
      # .github/workflows/playwright.yml ("E2E Tests") — running on a
      # GitHub-hosted runner with its own throwaway Postgres service.
      #
      # Moved because this self-hosted runner is missing the system libraries
      # Chromium links against (libnspr4, libnss3, libnssutil3, libXcomposite,
      # libXdamage, libXfixes, libXrandr, libxkbcommon) and has no passwordless
      # sudo to install them, so the gate failed on every run regardless of
      # whether the application code was sound.
      #
      # Consequence, stated plainly: nothing in THIS pipeline verifies the app
      # still works before it reaches production. The E2E Tests workflow
      # reports, it does not block. Make it a required status check on main to
      # get that protection back.

      - name: Sync to Deploy Path
        run: |
          DEPLOY_PATH="/var/www/School-app"
          RSYNC_ARGS=(-a --delete
            --exclude=.git
            --exclude=.env
            --exclude=.env.production
            --exclude=logs/
            --exclude=node_modules/
            --exclude='node_modules.orphaned-*'
            --exclude='dist.orphaned-*'
            --exclude='backend/dist.orphaned-*'
          )
          mkdir -p "$DEPLOY_PATH" 2>/dev/null || sudo -n mkdir -p "$DEPLOY_PATH"
          if [ "$(cd "${{ github.workspace }}" && pwd -P)" = "$(cd "$DEPLOY_PATH" 2>/dev/null && pwd -P)" ]; then
            echo "Workspace already is the deploy path — nothing to sync."
          elif command -v rsync >/dev/null 2>&1; then
            rsync "${RSYNC_ARGS[@]}" "${{ github.workspace }}/" "$DEPLOY_PATH/" \
              || sudo -n rsync "${RSYNC_ARGS[@]}" "${{ github.workspace }}/" "$DEPLOY_PATH/" \
              || { echo "::error::Sync to $DEPLOY_PATH failed even with sudo fallback — needs manual fix on the runner host."; exit 1; }
            echo "Synced to $DEPLOY_PATH"
          else
            echo "rsync not found, falling back to cp -a (no --delete, stale files may accumulate)"
            cp -a "${{ github.workspace }}/." "$DEPLOY_PATH/" \
              || sudo -n cp -a "${{ github.workspace }}/." "$DEPLOY_PATH/" \
              || { echo "::error::Sync to $DEPLOY_PATH failed even with sudo fallback — needs manual fix on the runner host."; exit 1; }
            echo "Synced to $DEPLOY_PATH"
          fi

      - name: Install Dependencies at Deploy Path
        run: |
          DEPLOY_PATH="/var/www/School-app"
          cd "$DEPLOY_PATH"
          if [ "$(cd "${{ github.workspace }}" && pwd -P)" = "$(pwd -P)" ]; then
            echo "Workspace already is the deploy path — node_modules is already current from Install Dependencies."
            exit 0
          fi
          for attempt in 1 2 3; do
            echo "Deploy-path npm ci attempt $attempt/3"
            if [ -d node_modules ]; then
              mv node_modules "node_modules.orphaned-$(date +%s)-$attempt" 2>/dev/null \
                || sudo -n mv node_modules "node_modules.orphaned-$(date +%s)-$attempt" 2>/dev/null \
                || true
            fi
            rm -rf node_modules 2>/dev/null || true
            if npm ci --cache "${{ runner.temp }}/npm-cache-deploy-${{ github.run_id }}-$attempt"; then
              echo "Deploy-path npm ci succeeded"
              exit 0
            fi
            echo "Deploy-path npm ci attempt $attempt failed"
            [ "$attempt" = "3" ] && { echo "::error::npm ci at $DEPLOY_PATH failed after 3 attempts — needs manual fix on the runner host."; exit 1; }
            sleep 15
          done

      - name: Zero-Downtime PM2 Reload
        # RUNNER_TRACKING_ID="" is load-bearing, do not remove it.
        #
        # Confirmed 2026-08-20 (runs 32426968440 and 32429642043): the job
        # reported success, then the runner's own teardown immediately killed
        # everything this step had just started:
        #
        #   Cleaning up orphan processes
        #   Terminate orphan process: pid (...) (PM2 v5.4.3: God)
        #   Terminate orphan process: pid (...) (node /var/www/S)   x6
        #
        # The runner tags every process it spawns with RUNNER_TRACKING_ID and
        # SIGKILLs the whole tagged tree at job end. Because CI spawned the PM2
        # daemon, the daemon and all six app instances were tagged — so each
        # "successful" deploy took the site down. That is also why every run
        # logged "Applications oliskey-api not running, starting..." : the
        # previous deploy's processes had already been killed.
        #
        # Blanking the variable for this step leaves the daemon untagged, so
        # teardown leaves it alone.
        #
        # This is the in-CI fix and needs no server access. The durable fix is
        # to have systemd own the daemon (`pm2 startup systemd` once, as root),
        # after which this step's `pm2 reload` just talks to the existing
        # daemon over its socket and never spawns anything to be cleaned up.
        run: |
          set -e
          export RUNNER_TRACKING_ID=""
          cd /var/www/School-app
          npx pm2 reload ecosystem.config.cjs --update-env || npx pm2 start ecosystem.config.cjs --env production
          # Persist the process list so a host reboot restores it.
          npx pm2 save || true

          # Prove the app is actually serving before calling this a success —
          # a green PM2 table only means the processes launched, not that they
          # stayed up or bound a port.
          #
          # Resolve the port the same way the app does. ecosystem.config.cjs
          # sets no port at all, so it comes from .env via env_file, and
          # backend/src/config/env.ts resolves BACKEND_PORT || PORT || 5000.
          # Hardcoding 3000 here (as the first version of this check did) can
          # interrogate a port nothing is listening on and fail a healthy
          # deploy.
          APP_PORT=$(grep -hE '^[[:space:]]*(BACKEND_PORT|PORT)[[:space:]]*=' .env 2>/dev/null \
                     | tail -1 | cut -d= -f2 | tr -d ' "'"'"'')
          APP_PORT=${APP_PORT:-5000}
          echo "App port resolved to $APP_PORT (from .env, default 5000)"

          echo "Verifying the API responds..."
          HEALTHY=0
          for i in $(seq 1 30); do
            if curl -sf "http://127.0.0.1:$APP_PORT/live" > /dev/null 2>&1; then
              echo "API is live on port $APP_PORT after $((i * 2))s"
              HEALTHY=1
              break
            fi
            sleep 2
          done

          if [ "$HEALTHY" != "1" ]; then
            echo "::error::PM2 started the app, but nothing answered http://127.0.0.1:$APP_PORT/live within 60s."
            npx pm2 logs oliskey-api --lines 40 --nostream || true
            exit 1
          fi

          # The app being up is not the same as the SITE being up: Apache
          # proxies /api and /socket.io to 127.0.0.1:3000 (see
          # deploy/apache-school-app.conf and the live vhost). If the app
          # bound a different port, every request through Apache 502s while
          # PM2 and the check above both look perfectly healthy.
          PROXY_PORT=3000
          if [ "$APP_PORT" != "$PROXY_PORT" ]; then
            echo "::error::Port mismatch: the app is listening on $APP_PORT but Apache proxies to $PROXY_PORT, so the live site will return 502."
            echo "::error::Fix by setting BACKEND_PORT=$PROXY_PORT in /var/www/School-app/.env (and the backup .env the Restore step copies from), then redeploy."
            exit 1
          fi
          echo "App port matches Apache's proxy target ($PROXY_PORT) — site should be serving."
