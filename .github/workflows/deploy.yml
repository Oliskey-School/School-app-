name: Production Deployment

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Build & Reload on Self-Hosted Server
    runs-on: self-hosted

    steps:
      - name: Fix Safe Directory Permissions
        run: git config --global --add safe.directory /var/www/School-app

      - name: Checkout Code
        run: |
          set -e
          for attempt in 1 2 3; do
            echo "Checkout attempt $attempt/3"
            rm -rf .git 2>/dev/null || true
            for d in node_modules dist backend/dist; do
              if [ -d "$d" ]; then
                mv "$d" "${d}.orphaned-$(date +%s)-$attempt" 2>/dev/null || true
              fi
              rm -rf "$d" 2>/dev/null || true
            done
            if [ -d node_modules ] || [ -d dist ] || [ -d backend/dist ]; then
              echo "rename+rm -rf left files behind, trying sudo..."
              sudo -n rm -rf node_modules dist backend/dist 2>/dev/null || echo "sudo unavailable or failed — needs manual fix on the runner host"
            fi
            git init -q
            git remote add origin "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
            if git fetch --depth 1 origin "${{ github.ref }}" && git checkout -qf FETCH_HEAD && git clean -ffdx -e node_modules -e dist -e backend/dist -e "node_modules.orphaned-*" -e "dist.orphaned-*" -e "backend/dist.orphaned-*"; then
              echo "Checkout succeeded"
              exit 0
            fi
            echo "Checkout attempt $attempt failed"
            [ "$attempt" = "3" ] && exit 1
            sleep 5
          done

      - name: Restore Environment & Binary Permissions
        run: |
          echo "Restoring production .env from persistent backup..."
          \cp -f /var/www/School-app-backup/.env ./.env 2>/dev/null || \cp -f /var/www/School-app-backup-20260818/.env ./.env 2>/dev/null || true
          \cp -f /var/www/School-app-backup/.env ./backend/.env 2>/dev/null || \cp -f /var/www/School-app-backup-20260818/.env ./backend/.env 2>/dev/null || true
          chmod -R +x node_modules/.bin 2>/dev/null || true

      - name: Setup Node
        run: |
          if ! command -v node >/dev/null 2>&1; then
            echo "::error::node not found on PATH on this runner host."
            exit 1
          fi
          echo "Using $(node --version), $(npm --version)"
          NODE_MAJOR=$(node -e "console.log(process.versions.node.split('.')[0])")
          if [ "$NODE_MAJOR" -lt 20 ]; then
            echo "::error::Node major version is $NODE_MAJOR, need >=20"
            exit 1
          fi

      - name: Install Dependencies
        run: |
          for attempt in 1 2 3 4 5; do
            echo "npm ci attempt $attempt/5"
            if [ -d node_modules ]; then
              mv node_modules "node_modules.orphaned-$(date +%s)-$attempt" 2>/dev/null || true
            fi
            rm -rf node_modules 2>/dev/null || true
            if npm ci --cache "${{ runner.temp }}/npm-cache-${{ github.run_id }}-$attempt"; then
              echo "npm ci succeeded"
              exit 0
            fi
            echo "npm ci attempt $attempt failed"
            [ "$attempt" = "5" ] && exit 1
            sleep 30
          done

      - name: Frontend Build
        run: |
          for attempt in 1 2 3; do
            echo "Frontend build attempt $attempt/3"
            if [ ! -f scripts/check-env.mjs ]; then
              echo "scripts/check-env.mjs missing — restoring from git HEAD"
              git show HEAD:scripts/check-env.mjs > scripts/check-env.mjs
            fi
            if npm run build; then
              exit 0
            fi
            echo "Frontend build attempt $attempt failed"
            [ "$attempt" = "3" ] && exit 1
            sleep 15
          done

      - name: Backend Build
        run: |
          for attempt in 1 2 3; do
            echo "Backend build attempt $attempt/3"
            if npm run build:backend; then
              exit 0
            fi
            echo "Backend build attempt $attempt failed"
            [ "$attempt" = "3" ] && exit 1
            sleep 15
          done

      - name: Production Critical Path Tests
        env:
          DATABASE_URL: ${{ secrets.TEST_DATABASE_URL }}
          DIRECT_URL: ${{ secrets.TEST_DATABASE_URL }}
          NODE_ENV: development
          BACKEND_PORT: 5099
          REDIS_URL: redis://127.0.0.1:6379/1
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          REFRESH_TOKEN_SECRET: ${{ secrets.REFRESH_TOKEN_SECRET }}
        run: |
          set -e
          if [ -z "${{ secrets.TEST_DATABASE_URL }}" ]; then
            echo "::error::TEST_DATABASE_URL secret is not set — see this step's comment for one-time setup. Refusing to deploy without running the release gate."
            exit 1
          fi

          echo "Applying migrations to the test database..."
          npx prisma migrate deploy --schema=backend/prisma/schema.prisma

          echo "Starting backend on port $BACKEND_PORT..."
          npx tsx backend/src/server.ts > /tmp/critical-path-backend.log 2>&1 &
          BACKEND_PID=$!

          echo "Starting frontend preview on port 4173..."
          npx vite preview --port 4173 --strictPort > /tmp/critical-path-preview.log 2>&1 &
          PREVIEW_PID=$!

          cleanup() {
            kill "$BACKEND_PID" "$PREVIEW_PID" 2>/dev/null || true
          }
          trap cleanup EXIT

          echo "Waiting for backend to become healthy..."
          for i in $(seq 1 30); do
            if curl -sf "http://127.0.0.1:$BACKEND_PORT/live" > /dev/null 2>&1; then
              echo "Backend healthy after ${i}s"
              break
            fi
            if [ "$i" = "30" ]; then
              echo "::error::Backend never became healthy — log:"
              cat /tmp/critical-path-backend.log
              exit 1
            fi
            sleep 1
          done

          export PLAYWRIGHT_BROWSERS_PATH="${{ runner.temp }}/pw-browsers-${{ github.run_id }}"
          npx playwright install chromium
          BASE_URL=http://localhost:4173 npx playwright test tests/e2e/production-critical-path.spec.ts --project=chromium --workers=1

      - name: Sync to Deploy Path
        run: |
          DEPLOY_PATH="/var/www/School-app"
          RSYNC_ARGS=(-a --delete
            --exclude=.git
            --exclude=.env
            --exclude=.env.production
            --exclude=logs/
            --exclude=node_modules/
            --exclude='node_modules.orphaned-*'
            --exclude='dist.orphaned-*'
            --exclude='backend/dist.orphaned-*'
          )
          mkdir -p "$DEPLOY_PATH" 2>/dev/null || sudo -n mkdir -p "$DEPLOY_PATH"
          if [ "$(cd "${{ github.workspace }}" && pwd -P)" = "$(cd "$DEPLOY_PATH" 2>/dev/null && pwd -P)" ]; then
            echo "Workspace already is the deploy path — nothing to sync."
          elif command -v rsync >/dev/null 2>&1; then
            rsync "${RSYNC_ARGS[@]}" "${{ github.workspace }}/" "$DEPLOY_PATH/" \
              || sudo -n rsync "${RSYNC_ARGS[@]}" "${{ github.workspace }}/" "$DEPLOY_PATH/" \
              || { echo "::error::Sync to $DEPLOY_PATH failed even with sudo fallback — needs manual fix on the runner host."; exit 1; }
            echo "Synced to $DEPLOY_PATH"
          else
            echo "rsync not found, falling back to cp -a (no --delete, stale files may accumulate)"
            cp -a "${{ github.workspace }}/." "$DEPLOY_PATH/" \
              || sudo -n cp -a "${{ github.workspace }}/." "$DEPLOY_PATH/" \
              || { echo "::error::Sync to $DEPLOY_PATH failed even with sudo fallback — needs manual fix on the runner host."; exit 1; }
            echo "Synced to $DEPLOY_PATH"
          fi

      - name: Install Dependencies at Deploy Path
        run: |
          DEPLOY_PATH="/var/www/School-app"
          cd "$DEPLOY_PATH"
          if [ "$(cd "${{ github.workspace }}" && pwd -P)" = "$(pwd -P)" ]; then
            echo "Workspace already is the deploy path — node_modules is already current from Install Dependencies."
            exit 0
          fi
          for attempt in 1 2 3; do
            echo "Deploy-path npm ci attempt $attempt/3"
            if [ -d node_modules ]; then
              mv node_modules "node_modules.orphaned-$(date +%s)-$attempt" 2>/dev/null \
                || sudo -n mv node_modules "node_modules.orphaned-$(date +%s)-$attempt" 2>/dev/null \
                || true
            fi
            rm -rf node_modules 2>/dev/null || true
            if npm ci --cache "${{ runner.temp }}/npm-cache-deploy-${{ github.run_id }}-$attempt"; then
              echo "Deploy-path npm ci succeeded"
              exit 0
            fi
            echo "Deploy-path npm ci attempt $attempt failed"
            [ "$attempt" = "3" ] && { echo "::error::npm ci at $DEPLOY_PATH failed after 3 attempts — needs manual fix on the runner host."; exit 1; }
            sleep 15
          done

      - name: Zero-Downtime PM2 Reload
        run: |
          cd /var/www/School-app
          npx pm2 reload ecosystem.config.cjs --update-env || npx pm2 start ecosystem.config.cjs --env production
