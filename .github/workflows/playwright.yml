name: E2E Tests

# Runs the production critical-path and role-performance suites on a
# GitHub-hosted runner with an isolated throwaway database.

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 3 * * *'

jobs:
  e2e:
    name: Production Critical Path + Performance
    runs-on: ubuntu-latest
    timeout-minutes: 60

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: school_app_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/school_app_test
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/school_app_test
      JWT_SECRET: ci-only-jwt-signing-key-not-used-anywhere-real
      REFRESH_TOKEN_SECRET: ci-only-refresh-signing-key-not-used-for-real
      NODE_ENV: development
      ENABLE_DEBUG_ROUTES: "true"
      BACKEND_PORT: 5099

    steps:
      # A PR's merge ref can lag behind the PR head. This suite is explicitly a
      # branch-head gate, so test the exact head commit on pull_request; manual
      # and scheduled runs keep the normal GitHub SHA.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply database migrations
        run: npx prisma migrate deploy --schema=backend/prisma/schema.prisma

      - name: Seed demo data
        run: npm run db:seed

      # Fast RLS/tenant-boundary regression gate. No running server needed —
      # it talks to the database directly. This is the release gate from the
      # multi-tenant security audit: fails the build if RLS coverage regresses,
      # a policy loses its WITH CHECK / branch clause, the tenant-mismatch
      # guard is removed from auth.middleware, or a previously-fixed
      # cross-tenant foreign-key write comes back. The slow, exhaustive,
      # live-server companion (tests/security/{seed-tenants,attack}.ts) is
      # documented in tests/security/README.md and run before a release
      # rather than on every push.
      - name: Multi-tenant security regression gate
        run: npx vitest run --config backend/vitest.config.ts backend/tests/integration/multi-tenant-security.test.ts

      - name: Build frontend
        run: npm run build

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Start backend and frontend preview
        run: |
          npx tsx backend/src/server.ts > /tmp/e2e-backend.log 2>&1 &
          npx vite preview --port 4173 --strictPort > /tmp/e2e-preview.log 2>&1 &
          echo "Waiting for backend to become healthy..."
          for i in $(seq 1 60); do
            if curl -sf "http://127.0.0.1:$BACKEND_PORT/live" > /dev/null 2>&1; then
              echo "Backend healthy after $((i * 2))s"
              exit 0
            fi
            if [ "$i" = "60" ]; then
              echo "::error::Backend never became healthy"
              cat /tmp/e2e-backend.log
              exit 1
            fi
            sleep 2
          done

      # Fail loudly here rather than as nine confusing test failures. The preview
      # server proxies /api to BACKEND_PORT (see vite.config.mts); if that proxy
      # is misresolved, every API call in the suite dies with a proxy error while
      # the backend itself looks perfectly healthy.
      - name: Verify frontend/API wiring
        run: |
          echo "Backend /live:"
          curl -fsS "http://127.0.0.1:$BACKEND_PORT/live"
          echo
          echo "Frontend shell:"
          curl -fsSI "http://127.0.0.1:4173/" | head -1
          echo "Proxied API path:"
          curl -fsSI "http://127.0.0.1:4173/api/health" | head -1

      - name: Run critical path suite
        run: BASE_URL=http://localhost:4173 npx playwright test tests/e2e/production-critical-path.spec.ts --project=chromium --workers=1

      - name: Run role performance matrix
        run: BASE_URL=http://localhost:4173 npx playwright test tests/e2e/performance-role-matrix.spec.ts --project=chromium --workers=1

      - name: Server logs on failure
        if: failure()
        run: |
          echo "::group::backend log (last 200 lines)"
          tail -200 /tmp/e2e-backend.log || true
          echo "::endgroup::"
          echo "::group::vite preview log (last 100 lines)"
          tail -100 /tmp/e2e-preview.log || true
          echo "::endgroup::"

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: .playwright-report/
          retention-days: 30
