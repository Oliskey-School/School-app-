name: Playwright Tests
# Manual-only. The E2E suite drives a fully running app (frontend + backend + database)
# via `npm run start:all`, which isn't available in CI — so it can only fail there.
# Run it locally (`npx playwright test`) or trigger this workflow by hand from the
# Actions tab when a live environment is provided.
on:
  workflow_dispatch:
jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: lts/*
    - name: Install dependencies
      run: npm ci
    - name: Install Playwright Browsers
      run: npx playwright install --with-deps
    - name: Run Playwright tests
      run: npx playwright test
    - uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: playwright-report
        path: playwright-report/
        retention-days: 30
