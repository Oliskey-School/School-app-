name: E2E Tests

# Runs the production critical-path and role-performance suites on a
# GitHub-hosted runner with an isolated throwaway database.

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - 'codex/**'
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 3 * * *'

jobs:
  e2e:
    name: Production Critical Path + Performance
    runs-on: ubuntu-latest
    timeout-minutes: 60

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: school_app_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      # The app connects as the NOBYPASSRLS role (as production does) so tenant
      # isolation is actually enforced in CI; migrations, seeding and test
      # fixtures use the superuser DIRECT_URL.
      DATABASE_URL: postgresql://oliskey_app:oliskey_app@localhost:5432/school_app_test
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/school_app_test
      JWT_SECRET: ci-only-jwt-signing-key-not-used-anywhere-real
      REFRESH_TOKEN_SECRET: ci-only-refresh-signing-key-not-used-for-real
      NODE_ENV: development
      ENABLE_DEBUG_ROUTES: "true"
      BACKEND_PORT: 5099
      VITE_API_URL: http://127.0.0.1:5099/api
      VITE_SOCKET_URL: http://127.0.0.1:5099

    steps:
      # A PR's merge ref can lag behind the PR head. This suite is explicitly a
      # branch-head gate, so test the exact head commit on pull_request; manual
      # and scheduled runs keep the normal GitHub SHA.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply database migrations
        run: npx prisma migrate deploy --schema=backend/prisma/schema.prisma
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/school_app_test

      # The migration creates the NOBYPASSRLS app role without a login; each
      # environment grants login with its own secret. CI's is throwaway.
      - name: Enable the app role login for CI
        run: PGPASSWORD=postgres psql -h localhost -U postgres -d school_app_test -v ON_ERROR_STOP=1 -c "ALTER ROLE oliskey_app LOGIN PASSWORD 'oliskey_app';"

      - name: Seed demo data
        run: npm run db:seed
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/school_app_test

      # Fast RLS/tenant-boundary regression gate. No running server needed —
      # it talks to the database directly. This is the release gate from the
      # multi-tenant security audit: fails the build if RLS coverage regresses,
      # a policy loses its WITH CHECK / branch clause, the tenant-mismatch
      # guard is removed from auth.middleware, or a previously-fixed
      # cross-tenant foreign-key write comes back. The slow, exhaustive,
      # live-server companion (tests/security/{seed-tenants,attack}.ts) is
      # documented in tests/security/README.md and run before a release
      # rather than on every push.
      - name: Multi-tenant security regression gate
        run: npx vitest run --config backend/vitest.config.ts backend/tests/integration/multi-tenant-security.test.ts

      # Metadata, structured data, robots/sitemap and manifest checks.
      # Also fails if a private route ever appears in sitemap.xml.
      # Knowledge retrieval, the security rules, user context, and the check
      # that the Gemini fallback receives exactly what NVIDIA was given.
      - name: AI knowledge layer checks
        run: npx tsx --tsconfig backend/tsconfig.json node_modules/vitest/vitest.mjs run --config backend/vitest.config.ts backend/tests/integration/ai-knowledge.test.ts

      # Fails if a number shown to a school is generated rather than queried.
      - name: No fabricated statistics
        run: npx vitest run --config vite.config.mts tests/quality/no-fabricated-data.test.ts

      - name: SEO and brand-entity checks
        run: npx vitest run --config vite.config.mts tests/seo/seo-metadata.test.ts

      # ---------------------------------------------------------------------
      # Security gate. Runs BEFORE the browser suite and fails the build.
      #
      # Until now this workflow ran nine Playwright tests and nothing else: the
      # 60+ backend integration suites — every tenant-isolation, RLS, IDOR,
      # payment and concurrency test in the repo — were never executed in CI,
      # so a green pipeline said almost nothing about multi-tenant safety.
      #
      # These run as the NOBYPASSRLS app role (see the job-level DATABASE_URL),
      # which is the only configuration in which the RLS policies are actually
      # exercised.
      # ---------------------------------------------------------------------
      - name: Security gate (tenant isolation, RLS, IDOR, payments, concurrency)
        run: |
          npx tsx --tsconfig backend/tsconfig.json node_modules/vitest/vitest.mjs run \
            --config backend/vitest.config.ts \
            backend/tests/integration/hostile-tenant-sweep.test.ts \
            backend/tests/integration/rls-child-tables.test.ts \
            backend/tests/integration/school-branch-integrity.test.ts \
            backend/tests/integration/parent-child-isolation.test.ts \
            backend/tests/integration/cross_tenant_probe.test.ts \
            backend/tests/integration/school-isolation.test.ts \
            backend/tests/integration/branch-isolation-full.test.ts \
            backend/tests/integration/write-isolation-sweep.test.ts \
            backend/tests/integration/payment-security.test.ts \
            backend/tests/integration/concurrency-stress.test.ts \
            backend/tests/integration/no-plaintext-passwords.test.ts \
            backend/tests/integration/auth-without-ambient-scope.test.ts \
            backend/tests/integration/rate-limit-without-redis.test.ts \
            backend/tests/integration/scoped-transactions.test.ts \
            backend/tests/integration/demo-seed-idempotent.test.ts \
            backend/tests/integration/auth-hardening.test.ts \
            backend/tests/integration/isolation.test.ts \
            backend/tests/integration/db-role-guard.test.ts \
            backend/tests/integration/required-relation-under-rls.test.ts
        env:
          # The app skips CSRF for NODE_ENV=test (see app.ts); the mocked
          # controller suites call routes without an Authorization header and
          # would otherwise be rejected with 403 before their assertions run.
          NODE_ENV: test

      - name: Backend integration suite (full)
        run: |
          npx tsx --tsconfig backend/tsconfig.json node_modules/vitest/vitest.mjs run \
            --config backend/vitest.config.ts
        env:
          # The app skips CSRF for NODE_ENV=test (see app.ts); the mocked
          # controller suites call routes without an Authorization header and
          # would otherwise be rejected with 403 before their assertions run.
          NODE_ENV: test

      - name: Build frontend
        run: npm run build

      - name: Install Playwright browsers
        id: playwright_install
        run: npx playwright install --with-deps chromium

      # Prove the browser exists rather than discovering it inside a test run.
      # Playwright resolves a build-numbered path per package version, so an
      # install that silently no-ops (or installs a different revision) only
      # surfaces later as "Executable doesn't exist", which reads like a browser
      # problem when it is really an install problem.
      - name: Verify Chromium is installed
        run: |
          node -e "
            const { chromium } = require('@playwright/test');
            const fs = require('fs');
            const p = chromium.executablePath();
            console.log('chromium executablePath:', p);
            if (!fs.existsSync(p)) {
              console.error('Chromium is NOT present at that path — the install step did not produce the build this package expects.');
              process.exit(1);
            }
            console.log('chromium present, size:', fs.statSync(p).size, 'bytes');
          "

      - name: Start backend and frontend preview
        id: preview
        run: |
          npx tsx backend/src/server.ts > /tmp/e2e-backend.log 2>&1 &
          npx vite preview --port 4173 --strictPort > /tmp/e2e-preview.log 2>&1 &
          echo "Waiting for backend to become healthy..."
          for i in $(seq 1 60); do
            if curl -sf "http://127.0.0.1:$BACKEND_PORT/live" > /dev/null 2>&1; then
              echo "Backend healthy after $((i * 2))s"
              exit 0
            fi
            if [ "$i" = "60" ]; then
              echo "::error::Backend never became healthy"
              cat /tmp/e2e-backend.log
              exit 1
            fi
            sleep 2
          done

      # Fail loudly here rather than as nine confusing test failures. The preview
      # server proxies /api to BACKEND_PORT (see vite.config.mts); if that proxy
      # is misresolved, every API call in the suite dies with a proxy error while
      # the backend itself looks perfectly healthy.
      - name: Verify frontend/API wiring
        run: |
          echo "Backend /live:"
          curl -fsS "http://127.0.0.1:$BACKEND_PORT/live"
          echo
          echo "Frontend shell:"
          curl -fsSI "http://127.0.0.1:4173/" | head -1
          echo "Proxied API path:"
          curl -fsSI "http://127.0.0.1:4173/api/health" | head -1

      - name: Run critical path suite
        run: BASE_URL=http://localhost:4173 npx playwright test tests/e2e/production-critical-path.spec.ts --project=chromium --workers=1 --reporter=list,html

      - name: Run role performance matrix
        if: ${{ !cancelled() }}
        run: BASE_URL=http://localhost:4173 npx playwright test tests/e2e/performance-role-matrix.spec.ts --project=chromium --workers=1 --reporter=list,html

      # Full logs, unconditionally — a failure investigation needs the whole
      # run, not just whatever fit in the last 200 lines. A backend that logs
      # one line per request across 9 tests x 3 retries x dozens of requests
      # each easily buries the one call (or its absence) that actually matters
      # well before the tail window, which is exactly what made an earlier
      # investigation on this branch look like "the demo-login endpoint is
      # never called" when the log simply no longer contained that far back.
      - name: Save full server logs
        if: always()
        run: |
          cp /tmp/e2e-backend.log ./e2e-backend-full.log 2>/dev/null || echo "(no backend log)" > ./e2e-backend-full.log
          cp /tmp/e2e-preview.log ./e2e-preview-full.log 2>/dev/null || echo "(no preview log)" > ./e2e-preview-full.log

      # Teacher, student and parent had no browser coverage at all: the
      # critical-path suite is admin-centric. This drives all four roles
      # through sign-in, navigation, reload, history, a phone viewport and
      # sign-out, failing on blank screens, stuck spinners, page errors or 5xx.
      # `!cancelled()` alone let this run after an EARLIER step had already
      # failed and its setup was skipped: no browsers installed, no frontend
      # built, no preview server. It then failed with "Executable doesn't exist",
      # which looked like a Playwright problem and hid the real failure further
      # up the job. It still runs when the critical-path suite fails — that is
      # the point of not using plain success() — but only once the browser stack
      # is genuinely up.
      - name: Four-role browser sweep
        if: ${{ !cancelled() && steps.preview.outcome == 'success' }}
        run: BASE_URL=http://localhost:4173 npx playwright test tests/e2e/four-role-sweep.spec.ts --project=chromium --workers=1

      - name: Server logs on failure
        if: failure()
        run: |
          echo "::group::backend log (last 200 lines — see the full-server-logs artifact for the complete run)"
          cat /tmp/e2e-backend.log || true
          echo "::endgroup::"
          echo "::group::vite preview log (last 100 lines)"
          tail -100 /tmp/e2e-preview.log || true
          echo "::endgroup::"

      # .playwright-report/ is the HTML summary (only produced if the html
      # reporter finishes writing it); .playwright-results/ is where Playwright
      # actually puts the per-test failure evidence this repo's own tests
      # reference on every failure — trace.zip, error-context.md (a DOM/ARIA
      # snapshot at the moment of failure), and screenshots. Only the summary
      # was ever uploaded before, so a genuinely broken run produced no
      # artifact at all ("No files were found with the provided path:
      # .playwright-report/") and every past investigation had to guess from
      # stdout text alone.
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: .playwright-report/
          retention-days: 30
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-results
          path: .playwright-results/
          retention-days: 30
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: full-server-logs
          path: |
            ./e2e-backend-full.log
            ./e2e-preview-full.log
          retention-days: 30
