# ============================================================================
# Jitsi Meet reverse proxy vhost — see deploy/jitsi/README.md for full setup.
# ============================================================================
#
#   sudo cp deploy/jitsi/nginx-jitsi.conf /etc/nginx/sites-available/meet
#   sudo ln -s /etc/nginx/sites-available/meet /etc/nginx/sites-enabled/
#   sudo certbot --nginx -d meet.yourschooldomain.com
#   sudo nginx -t && sudo systemctl reload nginx
#
# Assumes the Jitsi docker-compose stack is running locally with
# HTTP_PORT=8000 in its .env (see README.md step 2).

upstream jitsi_web {
    server 127.0.0.1:8000;
}

server {
    listen 80;
    server_name meet.yourschooldomain.com;   # <-- replace with your real subdomain

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name meet.yourschooldomain.com;   # <-- replace with your real subdomain

    # certbot fills these in automatically when run with --nginx
    # ssl_certificate     /etc/letsencrypt/live/meet.yourschooldomain.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/meet.yourschooldomain.com/privkey.pem;

    client_max_body_size 0;

    location / {
        proxy_pass http://jitsi_web;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Jitsi's BOSH/WebSocket signaling paths — required for the call to
    # actually connect, not just load the page shell.
    location /xmpp-websocket {
        proxy_pass http://jitsi_web;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /http-bind {
        proxy_pass http://jitsi_web;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
