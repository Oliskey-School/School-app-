# ============================================================================
# Oliskey — API proxy locations for the Vercel-frontend architecture
# ============================================================================
#
# WHY THIS FILE EXISTS (separate from deploy/nginx.conf)
# -----------------------------------------------------
# deploy/nginx.conf describes the OLD single-host setup: nginx serves the built
# SPA from /var/www/School-app/dist AND proxies /api on the same origin, so the
# browser never makes a cross-origin request and CORS is not involved.
#
# That is no longer the architecture. The SPA is served by Vercel at
# https://school-app-roan-one.vercel.app while this host serves only the API, so
# every API call is cross-origin.
#
# On 2026-08-25 the live vhost was found returning 301 to Vercel for EVERY path,
# including /api — which is an infinite loop:
#
#   browser -> vercel.app (SPA)  -> calls oliskeysms.duckdns.org/api/...
#           -> 301 back to vercel.app/api/...  -> 404 (no API on Vercel)
#
# Verified with curl:
#   /api/health  301 -> https://school-app-roan-one.vercel.app/api/health
#   /            301 -> https://school-app-roan-one.vercel.app/
#
# Do NOT replace the whole vhost with deploy/nginx.conf — that file listens on
# :80 with the :443 block commented out, and would drop the certbot TLS config
# this host is actually serving on.
#
# INSTALLING
# ----------
# 1. See what is redirecting:
#      sudo nginx -T | grep -n -B5 'return 301'
#
# 2. Edit the live vhost (likely /etc/nginx/sites-enabled/oliskey or
#    .../default) and paste the two location blocks below INSIDE the
#    `server { listen 443 ssl; ... }` block, ABOVE the catch-all `location / `.
#    nginx picks the most specific prefix match, so these win over `location /`
#    regardless of order — but keeping them above it keeps the file readable.
#
# 3. Apply:
#      sudo nginx -t && sudo systemctl reload nginx
#
# 4. Verify from anywhere (should be 200, not 301):
#      curl -i https://oliskeysms.duckdns.org/api/health
#
# Leave the existing `location / { return 301 ...vercel.app... }` alone if you
# want this host to send human visitors to the Vercel site. Only /api and
# /socket.io must stop redirecting.
# ============================================================================

# The Node backend. backend/src/config/env.ts resolves BACKEND_PORT || PORT ||
# 5000, and deploy/nginx.conf already assumes 5000 — confirm with:
#   sudo ss -lntp | grep node
# and change the port here if it differs.
upstream oliskey_backend {
    server 127.0.0.1:5000;
    keepalive 32;
    keepalive_requests 1000;
    keepalive_timeout 65s;
}

# --- API ---------------------------------------------------------------
# No CORS headers are set here on purpose. The application sets them itself
# (backend/src/app.ts) from ENABLE_CORS + CORS_ALLOWED_ORIGINS, as a strict
# allowlist. Adding add_header Access-Control-* here as well would produce
# duplicate headers, which browsers reject outright.
location /api/ {
    proxy_pass         http://oliskey_backend;
    proxy_http_version 1.1;
    proxy_set_header   Host              $host;
    proxy_set_header   X-Real-IP         $remote_addr;
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;
    proxy_set_header   Connection        "";

    # The preflight must reach the app, not be answered or redirected by nginx.
    proxy_pass_request_headers on;

    proxy_connect_timeout 10s;
    proxy_read_timeout    120s;
    proxy_send_timeout    120s;
}

# --- Socket.io ---------------------------------------------------------
# Demo role-switching depends on live updates, so this needs the websocket
# upgrade headers and a long read timeout — a normal proxy_pass silently
# downgrades it to failing long-polling.
location /socket.io/ {
    proxy_pass         http://oliskey_backend;
    proxy_http_version 1.1;
    proxy_set_header   Upgrade           $http_upgrade;
    proxy_set_header   Connection        "upgrade";
    proxy_set_header   Host              $host;
    proxy_set_header   X-Real-IP         $remote_addr;
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;

    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
}
