# ============================================================================
# Oliskey — ModSecurity / OWASP CRS false-positive tuning
# ============================================================================
#
# Drop this file in your ModSecurity rules directory and Include it AFTER the
# OWASP CRS is loaded (it references CRS rule IDs, so order matters), e.g. in
# your Apache vhost or modsecurity config:
#
#     IncludeOptional /etc/modsecurity.d/owasp-crs/*.conf
#     Include        /etc/modsecurity.d/modsec-oliskey-exclusions.conf
#
# Then reload Apache:  apachectl -t && systemctl reload apache2
#
# ----------------------------------------------------------------------------
# 1) Google Identity Services `g_state` cookie  →  SQLi false positives
# ----------------------------------------------------------------------------
# Google Sign-In sets a cookie named `g_state` whose value is a small JSON blob,
# e.g.  {"i_l":0,"i_p":1700000000000}.  The braces, quotes, colons and digits
# trip the CRS SQL-injection rules (942100/942190/942200/942260/942340/942370/
# 942430/942440 …) and push the anomaly score over the blocking threshold (403).
#
# This cookie is set by Google's own library — we cannot reformat it in app code,
# so we whitelist the SQLi/“suspicious cookie” checks for THAT ONE cookie only.
# Everything else on the request is still inspected normally.

SecRule REQUEST_COOKIES_NAMES "@streq g_state" \
    "id:1000100,phase:1,pass,nolog,t:none,\
     ctl:ruleRemoveTargetByTag=attack-sqli;REQUEST_COOKIES:g_state,\
     ctl:ruleRemoveTargetByTag=attack-injection-generic;REQUEST_COOKIES:g_state,\
     ctl:ruleRemoveTargetById=942100;REQUEST_COOKIES:g_state,\
     ctl:ruleRemoveTargetById=942190;REQUEST_COOKIES:g_state,\
     ctl:ruleRemoveTargetById=942200;REQUEST_COOKIES:g_state,\
     ctl:ruleRemoveTargetById=942260;REQUEST_COOKIES:g_state,\
     ctl:ruleRemoveTargetById=942340;REQUEST_COOKIES:g_state,\
     ctl:ruleRemoveTargetById=942370;REQUEST_COOKIES:g_state,\
     ctl:ruleRemoveTargetById=942430;REQUEST_COOKIES:g_state,\
     ctl:ruleRemoveTargetById=942440;REQUEST_COOKIES:g_state"

# ----------------------------------------------------------------------------
# 2) Oliskey's OWN CSRF cookie `psid-csrf`  →  deterministic, regex-matchable
# ----------------------------------------------------------------------------
# Our anti-CSRF cookie is produced by the `csrf-csrf` library. Its value uses a
# FIXED character set only — lowercase hex plus a single `|` separator:
#
#       ^[0-9a-f]{1,800}(\|[0-9a-f]{1,800})?$
#
# It is never random punctuation/JSON, so the WAF can safely allow-list it.
# Whitelist the SQLi/injection checks for this cookie (its long hex strings can
# otherwise look like obfuscated payloads under aggressive paranoia levels).

SecRule REQUEST_COOKIES_NAMES "@streq psid-csrf" \
    "id:1000110,phase:1,pass,nolog,t:none,\
     ctl:ruleRemoveTargetByTag=attack-sqli;REQUEST_COOKIES:psid-csrf,\
     ctl:ruleRemoveTargetByTag=attack-injection-generic;REQUEST_COOKIES:psid-csrf"

# Optional hard assertion: reject a `psid-csrf` cookie that does NOT match the
# fixed format above (defence-in-depth — a malformed one is never legitimate).
# Uncomment to enforce.
#
# SecRule REQUEST_COOKIES:psid-csrf "!@rx ^[0-9a-f]{1,800}(\|[0-9a-f]{1,800})?$" \
#     "id:1000111,phase:1,deny,status:403,log,msg:'Malformed Oliskey CSRF cookie'"

# ----------------------------------------------------------------------------
# 3) Large base64 photo uploads (profile/student photos sent inline)
# ----------------------------------------------------------------------------
# The app posts photos as base64 data-URLs in JSON. These long strings can trip
# the request-body size / injection heuristics. We tag our own traffic with the
# `X-App: oliskey-api` response header, but for REQUESTS the reliable signal is
# the JSON content-type on our /api routes — raise the body anomaly tolerance.
#
# Adjust SecRequestBodyLimit in your main config if you raised BODY_LIMIT in the
# app (default there is 15mb):
#
#     SecRequestBodyLimit 16000000
#     SecRequestBodyNoFilesLimit 16000000
