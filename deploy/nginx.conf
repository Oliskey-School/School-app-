# ============================================================================
# Oliskey — nginx reverse proxy (replaces vercel.json + in-app CORS)
# ============================================================================
#
# Serves the built SPA (dist/) and proxies /api + /socket.io to the Node backend
# on 127.0.0.1:5000. CORS, security headers, the SPA fallback and HTTPS all live
# HERE now — the app no longer sets them itself.
#
#   sudo cp deploy/nginx.conf /etc/nginx/sites-available/oliskey
#   sudo ln -s /etc/nginx/sites-available/oliskey /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# TLS: terminate with certbot (Let's Encrypt) — see the commented 443 block.

upstream oliskey_backend {
    server 127.0.0.1:5000;
    keepalive 32;
    keepalive_requests 1000;
    keepalive_timeout 65s;
}

server {
    listen 80;
    server_name oliskeysms.duckdns.org;

    # Client-facing keepalive — matched to the upstream's so both legs of the
    # proxy behave consistently. Independent of `upstream { keepalive_timeout }`
    # above, which governs the nginx<->Node pool.
    keepalive_timeout 75s;
    keepalive_requests 1000;

    root /var/www/School-app/dist;   # where `npm run build` output is deployed
    index index.html;

    # --- Security headers (formerly in vercel.json) ---
    add_header X-Frame-Options            "DENY"                              always;
    add_header X-Content-Type-Options     "nosniff"                           always;
    add_header Referrer-Policy            "strict-origin-when-cross-origin"   always;
    add_header Permissions-Policy         "camera=(), microphone=(), geolocation=(), payment=(self)" always;
    # HSTS — enable once HTTPS is live:
    # add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

    # CSP for the static SPA shell. (The API sets its own per-request nonce CSP.)
    # frame-src additions below are the Learning Hub's verified-embeddable OER
    # sources (PhET, AdaptedMind, Scratch, YouTube, GeoGebra) — without these,
    # the browser silently blocks the iframe with no visible error, and the
    # Learning Hub's own embeddability check falsely reports the resource as
    # blocked by the *external* site when it's actually blocked by our CSP.
    #
    # TODO if you self-host Jitsi (see deploy/jitsi/README.md): add your Jitsi
    # domain to BOTH frame-src (the embedded call itself is an iframe) and
    # script-src (Jitsi's IFrame API loads external_api.js from that domain) —
    # e.g. "https://meet.yourschooldomain.com" — or the embedded call will be
    # silently blocked by this same CSP, exactly like the Learning Hub was.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://accounts.google.com https://www.gstatic.com https://js.paystack.co https://checkout.flutterwave.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob: https://api.dicebear.com https://cdn-icons-png.flaticon.com https://via.placeholder.com https://*.googleusercontent.com; connect-src 'self' https://generativelanguage.googleapis.com https://api.paystack.co https://*.ingest.sentry.io https://accounts.google.com https://*.daily.co wss://*.daily.co https://*.wss.daily.co; media-src 'self' blob: https://*.daily.co; frame-src 'self' https://js.paystack.co https://checkout.flutterwave.com https://accounts.google.com https://*.daily.co https://phet.colorado.edu https://www.adaptedmind.com https://scratch.mit.edu https://www.youtube.com https://www.geogebra.org https://www.desmos.com https://www.mathsisfun.com https://www.shodor.org https://blockly.games https://code.org https://kids.nationalgeographic.com https://www.commonlit.org https://www.gutenberg.org https://www.khanacademy.org https://openstax.org; worker-src 'self' blob:; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

    # --- API proxy (same-origin: no CORS needed in the browser) ---
    location /api/ {
        proxy_pass         http://oliskey_backend;
        proxy_http_version 1.1;
        # Clearing the (default, per-request-unique) Connection header is what
        # actually lets nginx reuse a pooled keepalive connection to the "upstream
        # oliskey_backend" block above — without this line, nginx sends
        # "Connection: close" upstream on every request and the `keepalive 32`
        # pool above is never used (every request pays a fresh TCP+TLS handshake
        # to Node). This is the fix for the keepalive pool being silently dead.
        proxy_set_header   Connection        "";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        # Pass auth + CSRF through, and expose the rotated single-use CSRF token.
        proxy_pass_request_headers on;
        proxy_read_timeout 120s;

        # If you ever serve the API on a DIFFERENT origin than the SPA, uncomment
        # and set the exact origin (never use "*" with credentials):
        # add_header Access-Control-Allow-Origin      "https://your-app-domain"  always;
        # add_header Access-Control-Allow-Credentials "true"                      always;
        # add_header Access-Control-Allow-Headers     "Content-Type, Authorization, X-CSRF-Token, X-Branch-Id" always;
        # add_header Access-Control-Expose-Headers    "X-CSRF-Token"             always;
        # if ($request_method = OPTIONS) { return 204; }
    }

    # --- WebSocket (socket.io) proxy ---
    location /socket.io/ {
        proxy_pass         http://oliskey_backend;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host       $host;
        proxy_read_timeout 3600s;
    }

    # --- Uploaded files proxied to the backend's /uploads ---
    location /uploads/ {
        proxy_pass http://oliskey_backend;
        proxy_set_header Host $host;
    }

    # --- Long-cache hashed build assets ---
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # --- SPA fallback (formerly vercel.json "rewrites") ---
    location / {
        try_files $uri $uri/ /index.html;
    }
}

# ----------------------------------------------------------------------------
# HTTPS (recommended). After `certbot --nginx -d your-domain`, certbot fills in
# the ssl_certificate lines and adds a redirect from :80 → :443 automatically.
# ----------------------------------------------------------------------------
